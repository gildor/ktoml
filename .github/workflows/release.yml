name: Create release to Maven Central

on:
  # manual, on-request snapshot publish (Actions "Run workflow" / `gh workflow run`)
  workflow_dispatch:
  # signed release on a version tag
  push:
    tags:
      - 'v*'

env:
  SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

jobs:
  release:
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # release workflow should have access to all tags
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Status git before
        run: git status
      - uses: burrunan/gradle-cache-action@v3
        with:
          gradle-version: wrapper
      # Until https://github.com/burrunan/gradle-cache-action/issues/42 is addressed, gradle should be run as a separate step
      - name: gradle release from tag
        # if workflow is triggered after push of a tag, deploy full release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # PGP env is step-scoped: an empty workflow-level PGP_SEC would enable
        # signing with an empty key and break unsigned snapshot builds
        env:
          PGP_SEC: ${{ secrets.PGP_SEC }}
          PGP_PASSWORD: ${{ secrets.PGP_PASSWORD }}
        # closeAndRelease (vs close) auto-promotes to Maven Central: close uploads the
        # staging repo to the Central Portal as publishing_type=user_managed, which then
        # waits for a manual "Publish" click; release issues the Nexus promote call that
        # the OSSRH staging-api bridge maps to a Portal publish, so the deployment goes
        # to Central automatically once validation passes — no manual step.
        run: ./gradlew
          --console=rich
          -Prelease
          -Pgroup=app.gildor
          -PgprUser=${{ github.actor }}
          -PgprKey=${{ secrets.GITHUB_TOKEN }}
          publishToSonatype closeAndReleaseSonatypeStagingRepository
      - name: gradle publish snapshot
        # manual on-request snapshot publish (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./gradlew
          --console=rich
          -Pgroup=app.gildor
          -Preckon.stage=snapshot
          -Preckon.scope=minor
          publishToSonatype
      - name: Status git after
        if: ${{ always() }}
        run: git status

  github_release:
    needs: release
    name: Create Github Release
    # only for tag releases, not for branch snapshot builds
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # creating a release needs write access to repo contents; the default token is read-only
    permissions:
      contents: write
    steps:
      - name: Create Github Release
        # actions/create-release@v1 is archived/unmaintained; this one is maintained and
        # auto-generates notes from merged PRs since the previous tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ktoml ${{ github.ref_name }}
          generate_release_notes: true
