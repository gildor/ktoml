[package]
name = "ktoml-demo"
version = "0.4.2"
edition = "2021"
authors = ["Jane Doe <jane@example.com>", "John Roe <john@example.com>"]
description = "A small realistic Cargo manifest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/ktoml-demo"
keywords = ["toml", "parser", "benchmark"]
rust-version = "1.74.0"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.36.0", features = ["full"] }
clap = { version = "4.5.1", features = ["derive", "env"] }
anyhow = "1.0.80"
thiserror = "1.0.57"

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "demo"
path = "src/main.rs"
