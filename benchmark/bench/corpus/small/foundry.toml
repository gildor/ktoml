[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
gas_reports = ["*"]

[profile.ci]
fuzz = { runs = 10_000 }
verbosity = 4

[rpc_endpoints]
mainnet = "https://eth-mainnet.example.com/v3/key"
sepolia = "https://eth-sepolia.example.com/v3/key"

[etherscan]
mainnet = { key = "ABC123", chain = 1 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
