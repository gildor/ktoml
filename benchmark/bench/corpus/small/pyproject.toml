[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "example-pkg"
version = "2.3.1"
description = "Realistic pyproject for benchmarking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Jane Doe", email = "jane@example.com" }]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "mypy>=1.8.0", "ruff>=0.3.0"]

[project.urls]
Homepage = "https://example.com"
Source = "https://github.com/example/example-pkg"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.9"
warn_unused_ignores = true
